    Label6_25 As label:
        AutoHeight: =true
        Color: |-
            =If(
                Self.Text = "El curso no está correctamente configurado", 
                Color.Red, 
                Colors.Primary1 // 👈 Cambia este RGBA por tu color de texto normal si es distinto
            )
        FontWeight: =FontWeight.Semibold
        Height: =30
        Size: |-
            =If(
                Self.Text = "El curso no está correctamente configurado", 
                10, // 👈 Tamaño pequeño para el aviso
                13  // 👈 Tamaño normal para el número de horas
            )
        Text: |-
            =/*With(
                {
                    // FASE 1: Contamos operarios y localizamos el curso seleccionado
                    NumeroOperarios: CountRows(Gallery1.AllItems);
                    CursoAnual: LookUp(
                        'Cursos Formativos'; 
                        Title = Curso_Formativo_1.Selected.Value && Plan_Form = Plan_Formativo_1.Selected.Value
                    )
                };
                
                With(
                    {
                        HorasDelCurso: Value(
                            LookUp(
                                CursosFormativosUnicos; 
                                ID = CursoAnual.ID_CURSO_UNICO 
                            ).HORAS
                        )
                    };
                    
                    // FASE 3: Cálculo final
                    NumeroOperarios * HorasDelCurso
                )
            )*/
            
            With(
                {
                    // FASE 1: Buscamos el curso y contamos operarios
                    NumeroOperarios: CountRows(Gallery1.AllItems),
                    CursoAnual: LookUp(
                        CursosFormativos_Plan, 
                        Title = Curso_Formativo_1.Selected.Value && Plan_Form = Plan_Formativo_1.Selected.Value
                    )
                },
                
                With(
                    {
                        // FASE 2: PURIFICACIÓN
                        IdPuro: Value(CursoAnual.ID_CURSO_UNICO) 
                    },
                    
                    With(
                        {
                            // FASE 3: Búsqueda delegable
                            HorasDelCurso: Value(
                                LookUp(
                                    CursosFormativos, 
                                    Title = Text(IdPuro) 
                                ).HORAS
                            )
                        },
                        
                        If(
                            IsBlank(HorasDelCurso),
                            "El curso no está correctamente configurado",
                            NumeroOperarios * HorasDelCurso
                        )
                    )
                )
            )
        Width: =284
        X: =584
        Y: =307
        ZIndex: =26

