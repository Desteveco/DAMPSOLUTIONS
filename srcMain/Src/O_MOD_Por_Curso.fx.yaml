    "Gallery1 As gallery.'BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0'":
        '#CopilotOverlayLabel': ="Filtrada"
        BorderColor: =Colors.Primary1
        BorderThickness: =1
        DelayItemLoading: =true
        Height: =919
        Items: |-
            =
            With(
                {
                    varCursoID: Value(
                        LookUp(
                            CursosFormativos_Plan, 
                            Title = Curso_Formativo_1.Selected.Value && Plan_Form = Plan_Formativo_1.Selected.Value
                        ).ID_CURSO_UNICO
                    )
                },
                
                With(
                    {
                        RegistrosDelCurso: Filter(
                            RegistrosFormacion,
                            Formador = false,
                            ID_Curso = varCursoID 
                        )
                    },
                    
                    Sort(
                        RegistrosDelCurso,
                        Creado,
                        SortOrder.Descending
                    )
                )
            )
        Layout: =Layout.Vertical
        LoadingSpinner: =LoadingSpinner.Data
        TemplateFill: |-
            =With(
                {
                    varIDMaestro: LookUp(
                        CursosFormativos_Plan, 
                        Title = Curso_Formativo_1.Selected.Value && 
                        Plan_Form = Plan_Formativo_1.Selected.Value
                    ).ID_CURSO_UNICO
                },
                
                With(
                    {
                        CursoMaestro: LookUp(
                            CursosFormativos, 
                            Title = varIDMaestro
                        )
                    },
                    
                    If(
                        CursoMaestro.EVALUACIÓN = false || IsBlank(CursoMaestro.EVALUACIÓN),
                        If(
                            ThisItem.'Tiene datos adjuntos' = true, 
                            ColorFade(Color.Green, 70%), 
                            ColorFade(Color.Red, 70%)
                        ),
            
                        CursoMaestro.EVALUACIÓN = true && CursoMaestro.METODO_EVAL.Value = "EXAMEN",
                        If(
                            ThisItem.Apto = true, 
                            ColorFade(Color.Green, 70%), 
                            ColorFade(Color.Red, 70%)
                        ),
            
                        CursoMaestro.EVALUACIÓN = true && CursoMaestro.METODO_EVAL.Value = "ILUO",
                        If(
                            !IsBlank(ThisItem.ILUO), 
                            ColorFade(Color.Green, 70%), 
                            ColorFade(Color.Red, 70%)
                        ),
            
                        ColorFade(Color.Gray, 70%)
                    )
                )
            )
        TemplatePadding: =0
        TemplateSize: =50
        Width: =568
        X: =1214
        Y: =161
        ZIndex: =9

        Icon_PDF_1 As icon:
            Color: =Colors.Primary1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =50
            Icon: =Icon.View
            OnSelect: |-
                =Select(Parent);
                Set(varPDF, true);
                Set(varID_Grupo, First(Filter(RegistrosFormacion, Num_Empleado = Value(Num_Empleado_Por_Curso.Text), First(Filter(CursosFormativos_Plan, Title = Curso_Formativo_1.Selected.Value, Plan_Form = Plan_Formativo_1.Selected.Value)).ID_CURSO_UNICO = ID_Curso)).ID_Grupo);
                Set(varDesdeCursos, true);
                Navigate(Formed_Screen,ScreenTransition.Cover)
            Width: =50
            X: =500
            ZIndex: =1

        Num_Empleado_Por_Curso As label:
