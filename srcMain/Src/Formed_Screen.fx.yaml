            Fill: |-
                =Switch(
                    Self.Text,
                    "No apto", Color.IndianRed,       // Rojo para los no aptos
                    "Apto", Color.MediumSeaGreen,     // Verde para los aptos
                    "I", Color.Gold,                  // Amarillo para I
                    "L", Color.MediumSeaGreen,        // Verde para L
                    "U", Color.LightSkyBlue,          // Azul clarito para U
                    "O", Color.DarkBlue,              // Azul oscuro para O
                    Color.LightGray                   // Gris por si algún dato está en blanco
                )
            Height: =Gallery4.TemplateHeight
            Size: =11
            Text: |-
                =With(
                    {
                        RegistroEncontrado: LookUp(
                            colRegistros, 
                            ID_Curso = Value(ThisItem.ID_Curso)
                        )
                    },
                    
                    If(
                        IsBlank(RegistroEncontrado),
                        "NO REALIZADO",
                        
                        If(
                            Not(IsBlank(ThisItem.ILUO.Value)), 
                            RegistroEncontrado.ILUO.Value,
                            
                            If(
                                ThisItem.Apto = true,
                                If(RegistroEncontrado.Apto = true, "REALIZADO", "NO REALIZADO"),
                                
                                If(
                                    RegistroEncontrado.'Tiene datos adjuntos' = true, 
                                    "REALIZADO", 
                                    "NO REALIZADO"
                                )
                            )
                        )
                    )
                )
