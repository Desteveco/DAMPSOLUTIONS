        OnSelect: |-
            =Refresh(RegistrosFormacion);
            
            ClearCollect(
                colTodosCursos,
                Sort(Filter(CursosFormativos, ID <> 18), Title, SortOrder.Ascending)
            );
            
            
            
            
            Concurrent(
                ClearCollect(
                    colPrimeros, 
                    Sort(Personal, ID, SortOrder.Ascending)
                ),
                ClearCollect(
                    colUltimos, 
                    Sort(Personal, ID, SortOrder.Descending)
                )
            );
            
            
            ClearCollect(
                colTodaLaProgramacion,
                colPrimeros,
                colUltimos
            );
            
            ClearCollect(
                colTodosLosOperarios,
                Sort(
                    Distinct(colTodaLaProgramacion, Numero_Empresa),
                    Value,
                    SortOrder.Ascending
                )
            );
            
            Clear(colRegistros);
            Clear(colMatrizFormacion);
            
            
            
            
            Navigate(O_MOD_Por_Operario, ScreenTransition.Cover)
