      - Button4:
          Control: ModernButton@1.0.0
          Properties:
            BasePaletteColor: =Colors.Primary3
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Segoe UI'
            Height: =55
            OnSelect: "=UpdateContext({ctxCargando: true});\r\n\r\nClearCollect(\r\n    colCursosFiltrados,\r\n    AddColumns(\r\n        Filter(\r\n            CursosFormativos_Plan,\r\n            (IsBlank(ComboBox_Area.Selected) || Area_Form = ComboBox_Area.Selected.Value),\r\n            (IsBlank(Plan_Formativo.Selected) || Plan_Form = Plan_Formativo.Selected.Value)\r\n        ),\r\n        MESES_VALIDEZ, LookUp(CursosFormativos, ID = ID_CURSO_UNICO).MESES_VALIDEZ\r\n    )\r\n);\r\n\r\nClearCollect(\r\n    colEmpleadosBase,\r\n    Distinct(\r\n        Filter(\r\n            Personal, \r\n            (IsBlank(ComboBox_Equipo.Selected.Title) || Tipo_Empleo = ComboBox_Equipo.Selected.Title),\r\n            (IsBlank(ComboBox_N_Empleado.Selected.Numero_Empresa) || Numero_Empresa = Value(ComboBox_N_Empleado.Selected.Numero_Empresa))\r\n        ),\r\n        Numero_Empresa\r\n    )\r\n);\r\n\r\nClear(colRegistrosTemp);\r\nForAll(\r\n    colEmpleadosBase As Emp,\r\n    Collect(\r\n        colRegistrosTemp,\r\n        Filter(\r\n            RegistrosFormacion,\r\n            Num_Empleado = Value(Emp.Value),\r\n            Formador = false \r\n        )\r\n    )\r\n);\r\n\r\nClearCollect(\r\n    colRegistros,\r\n    Filter(\r\n        colRegistrosTemp,\r\n        Value(ID_Curso) in colCursosFiltrados.ID_CURSO_UNICO && \r\n        \r\n        With(\r\n            {\r\n                MesesVigencia: LookUp(colCursosFiltrados, Value(ID_CURSO_UNICO) = Value(ID_Curso)).MESES_VALIDEZ\r\n            },\r\n            IsBlank(MesesVigencia) || DateAdd(Creado, Value(MesesVigencia), TimeUnit.Months) >= Today()\r\n        )\r\n    )\r\n);\r\n\r\nClearCollect(\r\n    colMatrizFormacion,\r\n    ForAll(\r\n        colEmpleadosBase As Emp,\r\n        {\r\n            N_Empleado: Value(Emp.Value), \r\n            NombreCompleto: LookUp(Personal, Numero_Empresa = Value(Emp.Value)).Nombre_Completo,\r\n            TotalCursosPlan: CountRows(colCursosFiltrados),\r\n            CursosCompletados: CountRows(Filter(colRegistros, Num_Empleado = Value(Emp.Value)))\r\n        }\r\n    )\r\n);\r\n\r\nUpdateContext({ctxCargando: false});\r\nNotify(\"Matriz organizada con éxito. Evaluando vigencias.\", NotificationType.Success)"
            Text: ="BUSCAR"
            Width: =101
            X: =1793
