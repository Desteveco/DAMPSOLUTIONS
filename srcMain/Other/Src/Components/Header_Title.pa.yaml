ComponentDefinitions:
  Header_Title:
    DefinitionType: CanvasComponent
    CustomProperties:
      ScreenName:
        PropertyKind: Input
        DisplayName: ScreenName
        Description: Nombre de la pantalla
        DataType: Text
        Default: ="Texto"
    Properties:
      Fill: =
      Height: =70
      Width: =Max(App.Width, App.MinScreenWidth)
    Children:
      - TextInput1_1:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =
            BorderThickness: =0
            Color: =RGBA(39, 67, 125, 1)
            Default: =""
            DisabledBorderColor: =RGBA(0, 0, 0, 0)
            DisabledColor: =RGBA(39, 67, 125, 1)
            DisabledFill: =RGBA(4, 57, 107, 1)
            DisplayMode: =DisplayMode.Disabled
            Font: =Font.'Open Sans'
            Height: =70
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =1920
      - Label2_1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(39, 67, 125, 1)
            Font: =Font.Arial
            Height: =70
            Size: =24
            Text: =Header_Title.ScreenName
            Width: =689
            X: =698
      - Image1:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =70
            Image: =LOGO2
            Width: =250
            X: =1670
