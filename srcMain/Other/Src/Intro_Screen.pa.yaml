Screens:
  Intro_Screen:
    Properties:
      Fill: =Colors.Primary3
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Header_Title_3:
          Control: CanvasComponent
          ComponentName: Header_Title
          Properties:
            Fill: =
            Height: =70
            ScreenName: ="CONSULTA FORMACIÓN REGISTRADA"
            Width: =Max(App.Width, App.MinScreenWidth)
      - Button1_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: =DisplayMode.View
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =758
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            RadiusBottomLeft: =40
            RadiusBottomRight: =40
            RadiusTopLeft: =40
            RadiusTopRight: =40
            Text: =""
            Width: =1423
            X: =278
            Y: =159
      - Button3_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =Colors.Primary1
            Font: =Font.'Open Sans'
            Height: =175
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =Colors.White
            HoverFill: =ColorFade(Colors.Primary1, -20%)
            OnSelect: |-
              =Refresh(RegistrosFormacion);

              ClearCollect(
                  colTodosCursos,
                  Sort(Filter(CursosFormativos, ID <> 18), Title, SortOrder.Ascending)
              );




              Concurrent(
                  ClearCollect(
                      colPrimeros, 
                      Sort(Personal, ID, SortOrder.Ascending)
                  ),
                  ClearCollect(
                      colUltimos, 
                      Sort(Personal, ID, SortOrder.Descending)
                  )
              );


              ClearCollect(
                  colTodaLaProgramacion,
                  colPrimeros,
                  colUltimos
              );

              ClearCollect(
                  colTodosLosOperarios,
                  Sort(
                      Distinct(colTodaLaProgramacion, Numero_Empresa),
                      Value,
                      SortOrder.Ascending
                  )
              );

              Clear(colRegistros);
              Clear(colMatrizFormacion);




              Navigate(O_MOD_Por_Operario, ScreenTransition.Cover)
            PaddingBottom: =20
            PressedBorderColor: =Self.Fill
            PressedColor: =Colors.White
            PressedFill: =ColorFade(Colors.Primary1, -20%)
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Size: =22
            Text: ="Consulta formación por OPERARIO"
            VerticalAlign: =VerticalAlign.Bottom
            Width: =511
            X: =459
            Y: =451
