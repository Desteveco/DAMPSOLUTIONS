      - Gallery1:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
          Properties:
            BorderColor: =Colors.Primary1
            BorderThickness: =1
            Height: =919
            Items: "=\r\nWith(\r\n    {\r\n        varCursoID: Value(\r\n            LookUp(\r\n                CursosFormativos_Plan, \r\n                Title = Curso_Formativo_1.Selected.Value && Plan_Form = Plan_Formativo_1.Selected.Value\r\n            ).ID_CURSO_UNICO\r\n        )\r\n    },\r\n    \r\n    With(\r\n        {\r\n            RegistrosDelCurso: Filter(\r\n                RegistrosFormacion,\r\n                Formador = false,\r\n                ID_Curso = varCursoID \r\n            )\r\n        },\r\n        \r\n        Sort(\r\n            RegistrosDelCurso,\r\n            Creado,\r\n            SortOrder.Descending\r\n        )\r\n    )\r\n)"
            TemplateFill: "=With(\r\n    {\r\n        varIDMaestro: LookUp(\r\n            CursosFormativos_Plan, \r\n            Title = Curso_Formativo_1.Selected.Value && \r\n            Plan_Form = Plan_Formativo_1.Selected.Value\r\n        ).ID_CURSO_UNICO\r\n    },\r\n    \r\n    With(\r\n        {\r\n            CursoMaestro: LookUp(\r\n                CursosFormativos, \r\n                Title = varIDMaestro\r\n            )\r\n        },\r\n        \r\n        If(\r\n            CursoMaestro.EVALUACIÓN = false || IsBlank(CursoMaestro.EVALUACIÓN),\r\n            If(\r\n                ThisItem.'Tiene datos adjuntos' = true, \r\n                ColorFade(Color.Green, 70%), \r\n                ColorFade(Color.Red, 70%)\r\n            ),\r\n\r\n            CursoMaestro.EVALUACIÓN = true && CursoMaestro.METODO_EVAL.Value = \"EXAMEN\",\r\n            If(\r\n                ThisItem.Apto = true, \r\n                ColorFade(Color.Green, 70%), \r\n                ColorFade(Color.Red, 70%)\r\n            ),\r\n\r\n            CursoMaestro.EVALUACIÓN = true && CursoMaestro.METODO_EVAL.Value = \"ILUO\",\r\n            If(\r\n                !IsBlank(ThisItem.ILUO), \r\n                ColorFade(Color.Green, 70%), \r\n                ColorFade(Color.Red, 70%)\r\n            ),\r\n\r\n            ColorFade(Color.Gray, 70%)\r\n        )\r\n    )\r\n)"
            TemplateSize: =50
            Width: =568
            X: =1214
            Y: =161
