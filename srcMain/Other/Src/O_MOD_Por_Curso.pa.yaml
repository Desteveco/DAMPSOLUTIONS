      - Label6_25:
          Control: Label@2.5.1
          Properties:
            AutoHeight: =true
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: |-
              =If(
                  Self.Text = "El curso no está correctamente configurado", 
                  Color.Red, 
                  Colors.Primary1 // 👈 Cambia este RGBA por tu color de texto normal si es distinto
              )
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =30
            Size: |-
              =If(
                  Self.Text = "El curso no está correctamente configurado", 
                  10, // 👈 Tamaño pequeño para el aviso
                  13  // 👈 Tamaño normal para el número de horas
              )
            Text: "=/*With(\r\n    {\r\n        // FASE 1: Contamos operarios y localizamos el curso seleccionado\r\n        NumeroOperarios: CountRows(Gallery1.AllItems);\r\n        CursoAnual: LookUp(\r\n            'Cursos Formativos'; \r\n            Title = Curso_Formativo_1.Selected.Value && Plan_Form = Plan_Formativo_1.Selected.Value\r\n        )\r\n    };\r\n    \r\n    With(\r\n        {\r\n            HorasDelCurso: Value(\r\n                LookUp(\r\n                    CursosFormativosUnicos; \r\n                    ID = CursoAnual.ID_CURSO_UNICO \r\n                ).HORAS\r\n            )\r\n        };\r\n        \r\n        // FASE 3: Cálculo final\r\n        NumeroOperarios * HorasDelCurso\r\n    )\r\n)*/\r\n\r\nWith(\r\n    {\r\n        // FASE 1: Buscamos el curso y contamos operarios\r\n        NumeroOperarios: CountRows(Gallery1.AllItems),\r\n        CursoAnual: LookUp(\r\n            CursosFormativos_Plan, \r\n            Title = Curso_Formativo_1.Selected.Value && Plan_Form = Plan_Formativo_1.Selected.Value\r\n        )\r\n    },\r\n    \r\n    With(\r\n        {\r\n            // FASE 2: PURIFICACIÓN\r\n            IdPuro: Value(CursoAnual.ID_CURSO_UNICO) \r\n        },\r\n        \r\n        With(\r\n            {\r\n                // FASE 3: Búsqueda delegable\r\n                HorasDelCurso: Value(\r\n                    LookUp(\r\n                        CursosFormativos, \r\n                        Title = Text(IdPuro) \r\n                    ).HORAS\r\n                )\r\n            },\r\n            \r\n            If(\r\n                IsBlank(HorasDelCurso),\r\n                \"El curso no está correctamente configurado\",\r\n                NumeroOperarios * HorasDelCurso\r\n            )\r\n        )\r\n    )\r\n)"
            Width: =284
            X: =584
            Y: =307
