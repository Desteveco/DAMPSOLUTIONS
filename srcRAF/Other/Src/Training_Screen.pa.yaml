Screens:
  Training_Screen:
    Properties:
      Fill: =Colors.White
      LoadingSpinnerColor: =Colors.Primary1
    Children:
      - Header_8:
          Control: CanvasComponent
          ComponentName: Header_3
          Properties:
            Height: |+
              =70
            Width: =Max(App.Width, App.MinScreenWidth)
            Y: =69
            pageNumber: =""
            screenName: ="Selección de Formación"
            varTipoAudit: ="Texto"
      - Header_Title_6:
          Control: CanvasComponent
          ComponentName: Header_Title
          Properties:
            Height: |+
              =70
            Width: =Max(App.Width, App.MinScreenWidth)
            pageNumber: ="Texto"
            screenName: ="Texto"
      - dd_Area_Form:
          Control: Classic/DropDown@2.3.1
          Properties:
            AllowEmptySelection: =true
            BorderColor: =Input.BorderColor
            BorderThickness: =1
            ChevronBackground: =Colors.Primary1
            ChevronDisabledBackground: =Colors.Gray
            ChevronDisabledFill: =Colors.LightGray
            ChevronFill: =Colors.White
            ChevronHoverBackground: =ColorFade(Colors.Primary1, -20%)
            ChevronHoverFill: =Colors.White
            Color: =Input.Color
            Default: =Text(Now(),"yyyy")
            DisabledBorderColor: =Colors.Gray
            DisabledColor: =Colors.Gray
            DisabledFill: =Colors.LightGray
            Fill: =Colors.White
            FocusedBorderThickness: =Input.FocusedBorderThickness
            Font: =Font.'Open Sans'
            HoverColor: =Colors.White
            HoverFill: =Colors.Primary3
            Items: |-
              =ForAll(Distinct(CursosFormativos_Plan, Area_Form), {Result: ThisRecord.Value})
            Items.Value: =Result
            OnChange: =
            PressedColor: =Colors.Black
            PressedFill: =Self.Fill
            SelectionColor: =Colors.White
            SelectionFill: =Colors.Primary1
            Size: =14
            Width: =128
            X: =613
            Y: =188
      - Label2_27:
          Control: Label@2.5.1
          Properties:
            BorderColor: =Input.BorderColor
            Color: =Colors.TextBlue
            DisabledColor: =Colors.Gray
            Font: =Font.Arial
            FontWeight: =FontWeight.Semibold
            Text: ="Area Form:"
            Width: =128
            X: =613
            Y: =148
      - Gallery_Trainings:
          Control: Gallery@2.15.0
          Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver4.0
          Properties:
            BorderColor: =Input.BorderColor
            BorderThickness: =2
            DelayItemLoading: =false
            Height: =579
            Items: "=Filter(\r\n    CursosFormativos_Plan,\r\n    \r\n    \r\n    If(\r\n        !IsBlank(dd_Area_Form.Selected.Result),\r\n        dd_Area_Form.Selected.Result = Area_Form,\r\n        true\r\n    ),\r\n    If(\r\n        !IsBlank(dd_Curs_Plan.Selected.Result),\r\n        dd_Curs_Plan.Selected.Result = Plan_Form,\r\n        true\r\n    )\r\n)\r\n    "
            LoadingSpinner: =LoadingSpinner.None
            OnSelect: =
            TemplateFill: |-
              =If(
                  ThisItem.IsSelected,
                  RGBA(60, 100, 178, 0.5),
                  RGBA(0, 0, 0, 0)
              )
            TemplateSize: =80
            Width: =716
            X: =26
            Y: =284
          Children:
            - Title1_1:
                Control: Label@2.5.1
                Properties:
                  AutoHeight: =true
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =Colors.TextMain
                  DisabledColor: =Colors.Gray
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =14
                  Text: =ThisItem.Title
                  VerticalAlign: =VerticalAlign.Top
                  Width: =375
                  X: =12
                  Y: =9
            - Subtitle1_3:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =Colors.TextMain
                  DisabledColor: =Colors.Gray
                  Font: =Font.'Open Sans'
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Size: =12
                  Text: |-
                    ="Curso: " & ThisItem.Curso
                  VerticalAlign: =VerticalAlign.Top
                  Width: =245
                  X: =399
                  Y: =9
            - NextArrow1_1:
                Control: Classic/Icon@2.5.0
                Properties:
                  AccessibleLabel: =Self.Tooltip
                  BorderColor: =Input.BorderColor
                  Color: =Icons.Color
                  DisabledBorderColor: =Colors.Gray
                  DisabledColor: =Colors.LightGray
                  Height: =38
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  PaddingBottom: =10
                  PaddingLeft: =10
                  PaddingRight: =10
                  PaddingTop: =10
                  TabIndex: =0
                  Tooltip: ="Ver los detalles del elemento"
                  Width: =36
                  X: =650
                  Y: =14
            - Separator1_1:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =Input.BorderColor
                  Fill: =Colors.Primary3
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =Parent.Width
                  Y: =Parent.TemplateHeight - 1
            - Subtitle1_4:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =Colors.TextMain
                  DisabledColor: =Colors.Gray
                  Font: =Font.'Open Sans'
                  Height: =Self.Size * 1.8
                  OnSelect: =Select(Parent)
                  PaddingBottom: =0
                  PaddingLeft: =0
                  PaddingRight: =0
                  PaddingTop: =0
                  Text: |-
                    ="Area Formativa: " & ThisItem.Area_Form
                  VerticalAlign: =VerticalAlign.Top
                  Width: =245
                  X: =399
                  Y: =38
      - Button2_3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, Button.BorderDarkness%)
            Color: =Button.Color
            DisabledBorderColor: =ColorFade(Self.BorderColor, Button.DisabledPercent%)
            DisabledColor: =ColorFade(Self.Color, Button.DisabledPercent%)
            DisabledFill: =ColorFade(Self.Fill, Button.DisabledPercent%)
            DisplayMode: |-
              =If(
                  !IsBlank(Gallery_Trainings.Selected),
                  DisplayMode.Edit,
                  DisplayMode.Disabled
              )
            Fill: =Button.Fill
            Font: =Font.'Open Sans'
            Height: |+
              =56
            HoverBorderColor: =ColorFade(Self.BorderColor, (Button.HoverPercent * 1.3)%)
            HoverColor: =Self.Color
            HoverFill: =ColorFade(Self.Fill, Button.HoverPercent%)
            OnSelect: |-
              =
                  Navigate(Group_Screen, ScreenTransition.UnCover)
            PressedBorderColor: =ColorFade(Self.BorderColor, (Button.PressedPercent * 1.3)%)
            PressedFill: =ColorFade(Self.Fill, Button.PressedPercent%)
            RadiusBottomLeft: =28
            RadiusBottomRight: =28
            RadiusTopLeft: =28
            RadiusTopRight: =28
            Text: ="CONTINUAR"
            Width: =265
            X: =251
            Y: =915
      - Label1_5:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =Input.BorderColor
            Color: =Colors.TextBlue
            DisabledColor: =Colors.Gray
            Font: =Font.Arial
            FontWeight: =FontWeight.Semibold
            Height: =47
            Size: =16
            Text: ="Selección de la Formación a registrar:"
            Width: =713
            X: =28
            Y: =237
      - dd_Curs_Plan:
          Control: Classic/DropDown@2.3.1
          Properties:
            AllowEmptySelection: =true
            BorderColor: =Input.BorderColor
            BorderThickness: =1
            ChevronBackground: =Colors.Primary1
            ChevronDisabledBackground: =Colors.Gray
            ChevronDisabledFill: =Colors.LightGray
            ChevronFill: =Colors.White
            ChevronHoverBackground: =ColorFade(Colors.Primary1, -20%)
            ChevronHoverFill: =Colors.White
            Color: =Input.Color
            Default: =Year(Today())
            DisabledBorderColor: =Colors.Gray
            DisabledColor: =Colors.Gray
            DisabledFill: =Colors.LightGray
            Fill: =Colors.White
            FocusedBorderThickness: =Input.FocusedBorderThickness
            Font: =Font.Arial
            HoverColor: =Colors.White
            HoverFill: =Colors.Primary3
            Items: |-
              =ForAll(Distinct(CursosFormativos_Plan,Plan_Form), {Result: ThisRecord.Value})
            Items.Value: =Result
            OnChange: =
            OnSelect: =
            PaddingRight: =13.34
            PaddingTop: =13.34
            PressedColor: =Colors.Black
            PressedFill: =Self.Fill
            SelectionColor: =Colors.White
            SelectionFill: =Colors.Primary1
            Size: =14
            Width: =150
            X: =419
            Y: =188
      - Label3_1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Colors.Primary1
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            OnSelect: =
            Text: |+
              ="Plan Formativo"
            X: =419
            Y: =148
      - Icon5:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =Input.BorderColor
            Color: =Colors.White
            DisabledBorderColor: =Colors.Gray
            DisabledColor: =Colors.LightGray
            Height: =55
            Icon: =Icon.Sync
            OnSelect: |+
              =Refresh(CursosFormativos);
              Refresh(GruposFormacion);
              Refresh(RegistrosFormacion);

              Refresh(PuestosTrabajo);

              Refresh(Personal);
            Width: =55
            X: =702
            Y: =76
      - IconBack_3:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Height: =50
            Icon: =Icon.ArrowLeft
            OnSelect: |+
              =Navigate(Screen1, ScreenTransition.CoverRight)
            Width: =50
            X: =26
            Y: =76
