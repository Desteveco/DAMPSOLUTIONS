Screens:
  Screen1:
    Properties:
      Fill: =Colors.White
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =Colors.Primary1
    Children:
      - Main_Screen_1:
          Control: CanvasComponent
          ComponentName: Main_Screen
          Properties:
            Fill: =RGBA(4, 57, 107, 1)
            Height: =Max(App.Height, App.DesignHeight)
            Width: =Max(App.Width, App.DesignWidth)
      - Button1_1:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, Button.BorderDarkness%)
            Color: =Button.Color
            DisabledBorderColor: =ColorFade(Self.BorderColor, Button.DisabledPercent%)
            DisabledColor: =ColorFade(Self.Color, Button.DisabledPercent%)
            DisabledFill: =ColorFade(Self.Fill, Button.DisabledPercent%)
            Fill: =Button.Fill
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: |+
              =80
            HoverBorderColor: =ColorFade(Self.BorderColor, (Button.HoverPercent * 1.3)%)
            HoverColor: =Self.Color
            HoverFill: =ColorFade(Self.Fill, Button.HoverPercent%)
            OnSelect: |-
              =Navigate(Training_Screen, ScreenTransition.UnCover);
              Reset(Gallery_Trainings);
              ClearCollect(colTrainees, {}); Clear(colTrainees);
              ClearCollect(colAttachments, {}); Clear(colAttachments)
            PressedBorderColor: =ColorFade(Self.BorderColor, (Button.PressedPercent * 1.3)%)
            PressedFill: =ColorFade(Self.Fill, Button.PressedPercent%)
            RadiusBottomLeft: =30
            RadiusBottomRight: =30
            RadiusTopLeft: =30
            RadiusTopRight: =30
            Size: =20
            Text: ="COMENZAR"
            Width: =310
            X: =229
            Y: =564
