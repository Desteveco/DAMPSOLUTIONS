      - Button1:
          Control: Classic/Button@2.2.0
          Group: Group2
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: |-
              =If(
                  IsBlank(gal_Cursos.Selected),
                  DisplayMode.Disabled,
                  DisplayMode.Edit
              )
            Fill: =Colors.Primary1
            Font: =Font.'Open Sans'
            Height: =68
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(Colors.Primary1, -20%)
            OnSelect: "=Reset(gal_Sesiones);\nReset(dd_Curs_Area_3);\nReset(dd_Curs_Denom_3);\nSet(varCursoActual, gal_Cursos.Selected);\n\nWith(\n    {\n        varCursoMaestro: LookUp(\n            CursosFormativosUnicos, \n            ID_CURSO = gal_Cursos.Selected.ID_CURSO_UNICO\n        ),\n        \n        SesionesExistentes: LookUp(\n            'Sesiones Formación',\n            ID_Curso = Text(varCursoActual.ID)\n        )\n    },\n\n    If(\n        !IsBlank(SesionesExistentes),\n        Notify(\"ℹ️ Las sesiones para este curso ya estaban generadas de antes.\", NotificationType.Warning,2000),\n\n        true,\n        Notify(\"✅ Curso creado: \" & varCursoActual.Title, NotificationType.Success,2000);\n        \n        If(\n            Value(dd_Curs_Plan_3.Selected.Value) = 1,\n            \n            UpdateContext({ \n                varNuevaSesion: Patch(\n                    'Sesiones Formación',\n                    Defaults('Sesiones Formación'),\n                    {\n                        ID_Curso: varCursoActual.ID,\n                        Nombre: \"Sesión única de \" & varCursoActual.Title,\n                        Objetivos: varCursoMaestro.OBJETIVO, \n                        Contenidos: varCursoMaestro.CONTENIDO\n                    }\n                )\n            });\n\n            Refresh('Sesiones Formación');\n            UpdateContext({ varFilaEnEdicion: varNuevaSesion.ID });\n            \n            ,\n\n            Value(dd_Curs_Plan_3.Selected.Value) > 1,\n            \n            ForAll(\n                Sequence(Value(dd_Curs_Plan_3.Selected.Value)) As BucleSesion,\n                Patch(\n                    'Sesiones Formación',\n                    Defaults('Sesiones Formación'),\n                    {\n                        ID_Curso: varCursoActual.ID,\n                        Nombre: \"Sesión \" & BucleSesion.Value & \" de \" & varCursoActual.Title,\n                        Objetivos: varCursoMaestro.OBJETIVO,\n                        Contenidos: varCursoMaestro.CONTENIDO\n                    }\n                )\n            );\n            \n            Refresh('Sesiones Formación')\n        )\n    )\n);\n\nNavigate(Sesiones_Screen, ScreenTransition.UnCover)"
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="Sesiones y Grupos"
