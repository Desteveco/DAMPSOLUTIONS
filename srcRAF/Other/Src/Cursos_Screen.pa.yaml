                      MetadataKey: FieldValue
                      Properties:
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        Default: |-
                          =/*Text(
                              Right(    
                              First(
                                  SortByColumns(
                                      Filter(
                                          'Cursos Formativos'; Area_Form = DataCardValue1.Text
                                          );
                                      "Curso";SortOrder.Descending
                                  )
                              ).Curso;
                              2
                          ); TextFormat.Number) + 1*/
                          IfError(
                          If(
                              Form1.Mode = FormMode.New,
                              Dropdown_Area.Selected.Título & 
                              If(
                                  (Last(
                                  Split(
                                      First(
                                          SortByColumns(
                                              Filter(
                                                  CursosFormativos, Area_Form = Dropdown_Area.Selected.Título,
                                                  Plan_Form = Dropdown_Plan.Selected.Título
                                                  ),
                                              "Curso",SortOrder.Descending
                                          )
                                      ).Curso,
                                      Dropdown_Area.Selected.Título
                                  )).Value + 1) < 10,
                                  "0" & Last(
                                  Split(
                                      First(
                                          SortByColumns(
                                              Filter(
                                                  CursosFormativos, Area_Form = Dropdown_Area.Selected.Título,
                                                  Plan_Form = Dropdown_Plan.Selected.Título
                                                  ),
                                              "Curso",SortOrder.Descending
                                          )
                                      ).Curso,
                                      Dropdown_Area.Selected.Título
                                  )).Value + 1,
                                  Last(
                                  Split(
                                      First(
                                          SortByColumns(
                                              Filter(
                                                  CursosFormativos, Area_Form = Dropdown_Area.Selected.Título,
                                                  Plan_Form = Dropdown_Plan.Selected.Título
                                                  ),
                                              "Curso",SortOrder.Descending
