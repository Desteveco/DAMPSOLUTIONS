ComponentDefinitions:
  Main_Screen:
    DefinitionType: CanvasComponent
    Properties:
      Fill: =RGBA(4, 57, 107, 1)
      Height: =Max(App.Height, App.DesignHeight)
      Width: =Max(App.Width, App.DesignWidth)
    Children:
      - TextInput1_1:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: =
            DisabledBorderColor: =RGBA(255, 255, 255, 1)
            DisabledFill: =RGBA(255, 255, 255, 1)
            DisplayMode: =DisplayMode.Disabled
            Font: =Font.'Open Sans'
            Height: =863
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            RadiusBottomLeft: =30
            RadiusBottomRight: =30
            RadiusTopLeft: =30
            RadiusTopRight: =30
            Width: =643
            X: =Max(App.Width, App.MinScreenWidth)/2 - Self.Width/2
            Y: |+
              =Max(App.Height, App.MinScreenHeight)/2 - Self.Height/2
      - Image1_1:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Image: =LOGO1
            Width: =515
            X: =127
            Y: =224
      - Icon3_1:
          Control: Classic/Icon@2.5.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Parent.Fill
            Icon: =Icon.Leave
            OnSelect: =Exit()
            Rotation: =180
            X: =84
            Y: =105
      - Label2_1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(25, 25, 25, 1)
            Font: =Font.Arial
            FontWeight: =FontWeight.Bold
            Height: =114
            Size: =35
            Text: ="Registro de Asistencia a Formación"
            Width: =570
            X: =99
            Y: =350
