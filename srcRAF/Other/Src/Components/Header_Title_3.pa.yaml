ComponentDefinitions:
  Header_Title_3:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      pageNumber:
        PropertyKind: Input
        DisplayName: pageNumber
        Description: Propiedad personalizada
        DataType: Text
        Default: ="Texto"
      screenName:
        PropertyKind: Input
        DisplayName: screenName
        Description: Propiedad personalizada
        DataType: Text
        Default: ="Texto"
    Properties:
      Height: |+
        =70
      Width: =Max(App.Width, App.MinScreenWidth)
    Children:
      - TextInput2_2:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            BorderThickness: =0
            Color: =RGBA(39, 67, 125, 1)
            Default: =
            DisabledColor: =RGBA(39, 67, 125, 1)
            DisabledFill: =RGBA(4, 57, 107, 1)
            DisplayMode: =DisplayMode.Disabled
            Font: =Font.'Open Sans'
            Height: =90
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =768
            Y: =-20
      - labelTitle_2:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.Arial
            Height: =54
            Size: =24
            Text: =Header_Title_3.screenName
            Width: =385
            X: =99
            Y: =8
      - Image2_1:
          Control: Image@2.2.3
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Height: =70
            Image: =LOGO2
            Width: =261
            X: =484
