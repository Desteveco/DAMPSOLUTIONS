ComponentDefinitions:
  Header_3:
    DefinitionType: CanvasComponent
    AccessAppScope: true
    CustomProperties:
      pageNumber:
        PropertyKind: Input
        DisplayName: pageNumber
        Description: Propiedad personalizada
        DataType: Text
        Default: ="Texto"
      screenName:
        PropertyKind: Input
        DisplayName: screenName
        Description: Propiedad personalizada
        DataType: Text
        Default: ="Texto"
      varTipoAudit:
        PropertyKind: Input
        DisplayName: varTipoAudit
        Description: Propiedad personalizada
        DataType: Text
        Default: ="Texto"
    Properties:
      Height: |+
        =70
      Width: =Max(App.Width, App.MinScreenWidth)
    Children:
      - TextInput2_5:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            BorderThickness: =0
            Color: |+
              =RGBA(0, 18, 107, 1)
            Default: =
            DisabledColor: |+
              =RGBA(58, 100, 183, 1)
            DisabledFill: |-
              =//RGBA(70; 90; 150; 1)
              RGBA(60, 102, 140, 1)
            DisplayMode: =DisplayMode.Disabled
            Font: =Font.'Open Sans'
            Height: =90
            HoverBorderColor: =RGBA(0, 18, 107, 1)
            HoverFill: =RGBA(186, 202, 226, 1)
            RadiusBottomLeft: =20
            RadiusBottomRight: =20
            RadiusTopLeft: =20
            RadiusTopRight: =20
            Width: =768
            Y: =-20
      - labelPage_1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.Arial
            Height: =69
            Size: =20
            Text: =Header_3.pageNumber
            Width: =57
            X: =674
      - labelTitle_4:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.Arial
            Height: =69
            Size: =18
            Text: =Header_3.screenName
            Width: =539
            X: =115
