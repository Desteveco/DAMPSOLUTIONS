                    Filter('Sesiones Formación', ID_Curso = varFormItemSelected.ID) As SesionActual,
                    
                    Patch(
                        'Asistencia por sesion',
                        Defaults('Asistencia por sesion'),
                        {
                            Título: "Asist-" & varUltimoAlumno.Num_Empleado & "-S" & SesionActual.ID,
                            
