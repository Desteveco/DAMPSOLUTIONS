                =    Input.BorderColor
            BorderStyle: =BorderStyle.Dashed
            BorderThickness: =2
            Default: |-
                =
                LookUp(Personal, Numero_Empresa = ti_Emp_Num.Text).Nombre_Completo
            HintText: =""
            OnSelect: =
            RadiusBottomLeft: =5
            RadiusBottomRight: =5
            RadiusTopLeft: =5
            RadiusTopRight: =5
            VirtualKeyboardMode: =VirtualKeyboardMode.Numeric
            Visible: =varShowAddPerson || varShowSign
            Width: =414
            X: =262
            Y: =303
            ZIndex: =21

        bt_Accept_1 As button:
            Color: =Colors.White
            DisplayMode: |-
                =If(
                    !IsBlank(ti_Emp_Num.Text) && (BlankImage <> Formed_Sign.Image) && !IsBlank(lab_Emp_Name.Text) && ti_Emp_Num.Text <> "0" && 
                    !IsBlank(Dropdown1_1.Selected),
                    DisplayMode.Edit,
                    DisplayMode.Disabled
                )
            Fill: =Colors.Primary1
            Height: =29.99
            OnSelect: |-
                =With(
                    {
                        EmpleadoMaestro: LookUp(
                            Personal,
                            Título = ti_Emp_Num.Text
                        )
                    },
                    If(
                        IsBlank(EmpleadoMaestro.Nombre_Completo),
                        Patch(
                            Personal,
                            Defaults(Personal),
                            {
                                Título: ti_Emp_Num.Text,
                                Numero_Empresa: Value(ti_Emp_Num.Text),
                                Nombre_Completo: lab_Emp_Name.Text,
                                Tipo_Empleo: Dropdown1_1.Selected.Nombre
                            }
                        ),
                        IsBlank(EmpleadoMaestro.Tipo_Empleo),
                        Patch(
                            Personal,
                            EmpleadoMaestro,
                            {Tipo_Empleo: Dropdown1_1.Selected.Nombre}
                        )
                    )
                );
                ClearCollect(
                    colFirma,
                    {
                        numEmpleado: ti_Emp_Num.Text,
                        nombrEmpleado: lab_Emp_Name.Text,
                        Firma: Formed_Sign.Image
                    }
                );
                ClearCollect(
                    colAttachments,
                    {
                        Att: Table(
                            {
                                DisplayName: Concatenate(
                                    "Firma_",
                                    Text(
                                        Now(),
                                        "[$-en-US]yyyy-mm-dd-hh-mm-ss"
                                    ),
                                    ".jpg"
                                ),
                                Value: First(colFirma).Firma,
                                AbsoluteUri: "",
                                Id: "00000000-0000-0000-0000-000000000000"
                            }
                        )
                    }
                );
                With(
                    {
                        RegistroAntiguo: LookUp(
                            RegistrosFormacion,
                            ID_Grupo = Value(gal_Grupos.Selected.ID) && Num_Empleado = Value(ti_Emp_Num.Text)
                        )
                    },
                    If(
                        IsBlank(RegistroAntiguo),
                        Set(
                            varFirmaMaestro,
                            Patch(
                                RegistrosFormacion,
                                Defaults(RegistrosFormacion),
                                {
                                    ID_Curso: Value(gal_Grupos.Selected.ID_Curso),
                                    ID_Grupo: Value(gal_Grupos.Selected.ID),
                                    Num_Empleado: Value(ti_Emp_Num.Text),
                                    Nom_Empleado: lab_Emp_Name.Text,
                                    Asiste_Horario_Lab: Toggle2.Value
                                }
                            )
                        ),
                        Set(
                            varFirmaMaestro,
                            Patch(
                                RegistrosFormacion,
                                RegistroAntiguo,
                                {Asiste_Horario_Lab: Toggle2.Value}
                            )
                        )
                    )
                );
                SubmitForm(Form1);
                Refresh(RegistrosFormacion);
                UpdateContext(
                    {
                        varShowAddPerson: false,
                        varShowSign: false
                    }
                );
                Set(
                    varPersonSel,
                    Blank()
                );
                Reset(Formed_Sign);
                Reset(ti_Emp_Num)
            PaddingBottom: =3.75
            PaddingLeft: =3.75
            Size: =11.24
            Text: ="Aceptar"
            Visible: =varShowAddPerson || varShowSign
            X: =500
            Y: =819
            ZIndex: =22

