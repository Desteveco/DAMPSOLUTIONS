            HoverFill: =ColorFade(Colors.Primary1, -20%)
            OnSelect: "=// 1. Limpiamos interfaz\nReset(gal_Sesiones);\nReset(dd_Curs_Area_3);\nReset(dd_Curs_Denom_3);\n\n// 2. Comprobamos existencias\nUpdateContext({ \n    varTieneSesiones: !IsBlank(LookUp('Sesiones Formación', ID_Curso = Text(varFormItemSelected.ID)))\n});\n\nUpdateContext({ \n    varTieneGrupos: !IsBlank(LookUp(Grupos_Formacion, ID_Curso = varFormItemSelected.ID)) \n});\n\n// 3. El NUEVO Cerebro de Navegación\nIf(\n    varTieneSesiones,\n    // Condición A: SI HAY SESIONES -> Vamos a verlas/editarlas\n    Navigate(Sesiones_Screen, ScreenTransition.UnCover),\n    \n    !varTieneSesiones && !varTieneGrupos,\n    // Condición B: Todo está vacío -> Vamos a crear sesiones\n    Navigate(Sesiones_Screen, ScreenTransition.UnCover),\n    \n    // Condición C (Por defecto): NO hay sesiones, pero por algún motivo histórico SÍ hay grupos\n    Navigate(Grupos_Screen, ScreenTransition.UnCover)\n)"
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =14
            Text: ="Sesiones y Grupos"
            Width: =156
            X: =1384
