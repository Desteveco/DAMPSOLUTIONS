            OnSuccess: |
                =
                Set(varCursoActual, Self.LastSubmit);
                
                
                Notify("✅ Curso creado: " & varCursoActual.Title, NotificationType.Success);
                If(
                    
                    Value(dd_Curs_Plan_3.Selected.Value) = 1,
                    
                    UpdateContext({ 
                        varNuevaSesion: Patch(
                            'Sesiones Formación',
                            Defaults('Sesiones Formación'),
                            {
                                ID_Curso: Self.LastSubmit.ID,
                                Nombre: "Sesión única de " & varCursoActual.Title,
                                Objetivos: Self.LastSubmit.Objetivo, 
                                Contenidos: Self.LastSubmit.Contenidos
                            }
                        )
                    });
                
                    Refresh('Sesiones Formación');
                    UpdateContext({ varFilaEnEdicion: varNuevaSesion.ID });
                    ,
                
                   
                   
                   
                    Value(dd_Curs_Plan_3.Selected.Value) > 1,
                    
                    ForAll(
                        Sequence(Value(dd_Curs_Plan_3.Selected.Value)) As BucleSesion,
                        Patch(
                            'Sesiones Formación',
                            Defaults('Sesiones Formación'),
                            {
                                ID_Curso: Self.LastSubmit.ID,
                                Nombre: "Sesión " & BucleSesion.Value & " de " & varFormItemSelected.Title,
                                // Hereda los valores igual que en el Caso 1
                                Objetivos: Self.LastSubmit.Objetivo,
                                Contenidos: Self.LastSubmit.Contenidos
                            }
                        )
                    );
                    
                    Refresh('Sesiones Formación');
                    
                )
